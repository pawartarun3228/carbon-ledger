{% extends "base.html" %}

{% block title %}Set New Password - Carbon Ledger{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <!-- Logo & Header -->
        <div class="auth-header">
            <div class="auth-brand-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" stroke-width="2"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke-width="1.5"/>
                    <path d="M2 12h20" stroke-width="1.5"/>
                </svg>
            </div>
            <h1 class="auth-heading">Set new password</h1>
            <p class="auth-subheading">Choose a secure password for account <span class="fw-semibold text-dark">{{ email }}</span>.</p>
        </div>

        <!-- Reset Password Form -->
        <form method="POST" action="{{ url_for('reset_password_route', token=token) }}" class="auth-form" id="resetPasswordForm" novalidate>
            <div class="mb-3">
                <label for="new_password" class="form-label">New password</label>
                <div class="auth-input-group">
                    <input type="password" 
                           class="form-control" 
                           id="new_password" 
                           name="new_password" 
                           placeholder="At least 8 characters" 
                           required 
                           autocomplete="new-password" 
                           autofocus>
                    <button type="button" class="auth-toggle-pwd-btn" id="togglePasswordBtn" title="Toggle password visibility" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
                <div class="pwd-strength-bar">
                    <div class="pwd-strength-fill" id="pwdStrengthFill"></div>
                </div>
                <div class="pwd-strength-text" id="pwdStrengthText">Must contain 8+ characters with a number or symbol.</div>
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm new password</label>
                <input type="password" 
                       class="form-control" 
                       id="confirm_password" 
                       name="confirm_password" 
                       placeholder="Re-type new password" 
                       required 
                       autocomplete="new-password">
                <div class="invalid-feedback" id="confirmFeedback">Passwords do not match.</div>
            </div>

            <button type="submit" class="auth-btn-submit" id="submitBtn">
                <span class="spinner-border spinner-border-sm d-none" id="submitSpinner" role="status" aria-hidden="true"></span>
                <span id="submitText">Update Password</span>
            </button>
        </form>

        <div class="auth-footer-prompt">
            <a href="{{ url_for('login') }}">Back to sign in</a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdInput = document.getElementById('new_password');
    const confirmInput = document.getElementById('confirm_password');
    const toggleIcon = document.getElementById('toggleIcon');
    const strengthFill = document.getElementById('pwdStrengthFill');
    const strengthText = document.getElementById('pwdStrengthText');
    const form = document.getElementById('resetPasswordForm');
    const submitBtn = document.getElementById('submitBtn');
    const submitSpinner = document.getElementById('submitSpinner');
    const submitText = document.getElementById('submitText');

    if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', function () {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        });
    }

    if (pwdInput && strengthFill) {
        pwdInput.addEventListener('input', function () {
            const val = pwdInput.value;
            let score = 0;
            if (val.length >= 8) score += 1;
            if (val.length >= 12) score += 1;
            if (/[0-9]/.test(val)) score += 1;
            if (/[^A-Za-z0-9]/.test(val)) score += 1;

            if (val.length === 0) {
                strengthFill.style.width = '0%';
                strengthFill.style.backgroundColor = '#e2e8f0';
                strengthText.textContent = 'Must contain 8+ characters with a number or symbol.';
                strengthText.style.color = '#64748b';
            } else if (score <= 1) {
                strengthFill.style.width = '25%';
                strengthFill.style.backgroundColor = '#dc2626';
                strengthText.textContent = 'Weak: needs 8+ characters and number/symbol.';
                strengthText.style.color = '#dc2626';
            } else if (score === 2) {
                strengthFill.style.width = '50%';
                strengthFill.style.backgroundColor = '#d97706';
                strengthText.textContent = 'Fair: add special characters.';
                strengthText.style.color = '#d97706';
            } else if (score === 3) {
                strengthFill.style.width = '75%';
                strengthFill.style.backgroundColor = '#0d9488';
                strengthText.textContent = 'Good strength.';
                strengthText.style.color = '#0d9488';
            } else {
                strengthFill.style.width = '100%';
                strengthFill.style.backgroundColor = '#15803d';
                strengthText.textContent = 'Strong password.';
                strengthText.style.color = '#15803d';
            }
        });
    }

    if (form) {
        form.addEventListener('submit', function (e) {
            let isValid = true;
            pwdInput.classList.remove('is-invalid');
            confirmInput.classList.remove('is-invalid');

            if (!pwdInput.value || pwdInput.value.length < 8) {
                pwdInput.classList.add('is-invalid');
                isValid = false;
            }

            if (pwdInput.value !== confirmInput.value) {
                confirmInput.classList.add('is-invalid');
                isValid = false;
            }

            if (!isValid) {
                e.preventDefault();
                return;
            }

            submitBtn.disabled = true;
            submitSpinner.classList.remove('d-none');
            submitText.textContent = 'Updating...';
        });
    }
});
</script>
{% endblock %}
